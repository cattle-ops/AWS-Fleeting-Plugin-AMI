name: Build AMI in feature branch

on: # yamllint disable-line rule:truthy
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  build_ami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.PACKER_ROLE_ARN }}

      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        id: setup
        with:
          version: 1.14.2

      - name: Run `packer init`
        id: init
        run: |
          packer init src/
          
          # create the environment file for Packer
          PKR_VAR_vpc_id=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)
          echo "PKR_VAR_vpc_id=$PKR_VAR_vpc_id" > .env
          echo "PKR_VAR_ingress_cidrs=[\"$(aws ec2 describe-vpcs --vpc-ids ${PKR_VAR_vpc_id} --query 'Vpcs[0].CidrBlock' --output text)\"]" >> .env
          echo "PKR_VAR_subnet_id=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=${PKR_VAR_vpc_id} --query 'Subnets[0].SubnetId' --output text)" >> .env
          echo "PKR_VAR_aws_region=eu-central-1" >> .env
          
          cat .env

      - name: Run `packer validate`
        id: validate
        run: |
          packer validate src/

      - name: Build Artifact
        run: packer build src/
